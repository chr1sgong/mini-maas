# Prometheus
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
# role: pod 的服务发现需要 pods 读权限；namespaces 过滤在配置里做
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: observability
spec:
  # k3s 自带 local-path provisioner；emptyDir 会在 pod 重启时丢数据
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      # vLLM pod：annotation 发现（operator 在 pod template 注入注解）。
      # 5s 间隔: 给autoscaler反应留预算
      - job_name: vllm
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [mini-maas]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # instance = podIP:8000，与网关 endpoint 标签同口径
          # 路由分布与实例饱和度靠这个 key join，不要改成 pod 名。
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8000
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_maas_chr1sgong_io_model]
            target_label: model

      # 网关在宿主机：static 指 node InternalIP。
      # 查 IP：kubectl get node -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}'
      # 换网络环境后 IP 可能变，改这里再 delete prometheus pod 重载。
      - job_name: gateway
        static_configs:
          # - targets: ["HOST_INTERNAL_IP:8080"]
          - targets: ["192.168.2.199:8080"] # TODO: 不能写死IP, 使用域名比较好

      # dcgm-exporter（runbook Step 6）：同 vllm 的 annotation 模式，namespace 不同。
      - job_name: dcgm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (\d+);(.+)
            replacement: $2:$1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本 + PVC，rolling 会新旧抢同一块存储
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # 官方镜像以 nobody(65534) 运行；local-path 目录默认 root 属主，
      # fsGroup 让 TSDB 目录可写——忘配的典型症状是 pod 起来就 crash（permission denied）。
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0 # pin tag，锁定版本
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  # ClusterIP + port-forward 访问（Q3）；UI 无鉴权，不对集群外暴露
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
