apiVersion: v1
kind: Namespace
metadata:
  name: mini-maas
---
apiVersion: maas.chr1sgong.io/v1alpha1
kind: Model
metadata:
  name: qwen2.5-7b-awq
  namespace: mini-maas
spec:
  artifactURI: hf://Qwen/Qwen2.5-7B-Instruct-AWQ
  engine: vllm
  engineConfig:
    maxModelLen: 8192 
    maxNumSeqs: 64
    enablePrefixCaching: true
  image: vllm/vllm-openai:v0.30.0
  serving: 
    replicas: 2
    gpuMemoryUtilization: "0.45"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen7b-awq
  namespace: mini-maas
spec:
  selector: { app: vllm-qwen7b-awq }
  ports:
    - { name: http, port: 8000, targetPort: http }
